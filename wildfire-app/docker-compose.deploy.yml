services:
  app-backend-dev:
    image: ${APP_IMAGE:-wildfire-app:latest}
    container_name: app-backend-dev
    restart: unless-stopped
    env_file:
      - ./backend/.env.dev
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      KEYCLOAK_URL: http://keycloak:8080/keycloak
      KEYCLOAK_REALM: spatialhub
      AUTH_SERVICE_URL: http://auth-service:8001
      WEBSERVICE_SERVICE_URL: http://webservice:8082
      RATE_LIMIT_PER_MIN: 1000
    volumes:
      - backend-storage-dev:/app/storage
    networks:
      - spatialhub-net

  app-backend-prod:
    image: ${APP_IMAGE:-wildfire-app:latest}
    container_name: app-backend-prod
    restart: unless-stopped
    env_file:
      - ./backend/.env.prod
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      KEYCLOAK_URL: http://keycloak:8080/keycloak
      KEYCLOAK_REALM: spatialhub
      AUTH_SERVICE_URL: http://auth-service:8001
      WEBSERVICE_SERVICE_URL: http://webservice:8082
      RATE_LIMIT_PER_MIN: 1000
    volumes:
      - backend-storage-prod:/app/storage
    networks:
      - spatialhub-net

  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../nginx/conf.d:/etc/nginx/conf.d:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ../nginx/certbot:/var/www/certbot:ro
    networks:
      - spatialhub-net

volumes:
  backend-storage-dev:
  # External so this and the GeoServer compose share the SAME on-disk volume
  # (docker-compose would otherwise project-prefix the name and create two).
  backend-storage-prod:
    external: true

networks:
  spatialhub-net:
    external: true
